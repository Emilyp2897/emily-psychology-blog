<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="A person sitting cross-legged in meditation">
  <!-- Mind the Gael brand palette: purple #69005A, lime #C0FE71. Drawn rather
       than photographed so it stays crisp at any size and matches the other
       content hub icons in weight and colour. -->

  <!-- Breath rings rising above the head -->
  <path d="M78 40 q 22 -12 44 0" fill="none" stroke="#C0FE71" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M86 28 q 14 -8 28 0" fill="none" stroke="#C0FE71" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>

  <!-- Head -->
  <circle cx="100" cy="72" r="17" fill="#69005A"/>

  <!-- Torso -->
  <path d="M100 92
           c -13 0 -22 9 -24 21
           l -3 18
           h 54
           l -3 -18
           c -2 -12 -11 -21 -24 -21 z"
        fill="#69005A"/>

  <!-- Crossed legs -->
  <path d="M52 140
           c 0 -9 18 -15 48 -15
           s 48 6 48 15
           c 0 13 -21 21 -48 21
           s -48 -8 -48 -21 z"
        fill="#69005A"/>

  <!-- Arms resting on the knees -->
  <path d="M78 99 c -15 9 -24 23 -25 35" fill="none" stroke="#69005A" stroke-width="10" stroke-linecap="round"/>
  <path d="M122 99 c 15 9 24 23 25 35" fill="none" stroke="#69005A" stroke-width="10" stroke-linecap="round"/>

  <!-- Hands -->
  <circle cx="53" cy="136" r="7" fill="#69005A"/>
  <circle cx="147" cy="136" r="7" fill="#69005A"/>

  <!-- Lime detail across the legs, echoing the other icons' two-tone look -->
  <path d="M68 138 q 32 10 64 0" fill="none" stroke="#C0FE71" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
</svg>
